# Central config for the closed-loop app (blueprint §15). Values under robot.cameras/vlm match
# what's been empirically verified working in Milestones 1-4 — don't change camera_port/name
# without re-checking they still match the MuJoCo EnvHub's actual camera config.
project:
  name: g1-local-nav
  seed: 42

robot:
  camera_name: head_camera
  camera_port: 5555
  camera_server_address: localhost
  camera_width: 640
  camera_height: 480
  camera_fps: 30
  camera_warmup_s: 5

vlm:
  base_url: http://127.0.0.1:8000
  timeout_s: 8.0

control:
  action_duration_s: 0.30
  stop_settle_s: 0.15
  # Must comfortably exceed action_duration_s + stop_settle_s (0.45s) + a real VLM call, not
  # just vlm.timeout_s in isolation. Measured real SmolVLM2 latency on this Mac: 776-1642ms —
  # the blueprint's own suggested 1.0s (§15) trips on every single real decision once step
  # overhead is added in. Confirmed live: ep_real_002 watchdog-tripped after one successful
  # 776ms decision, purely from this being too tight. 12s gives real VLM calls (up to
  # vlm.timeout_s=8.0) room to legitimately finish, including step overhead, before the
  # watchdog assumes something actually hung.
  heartbeat_timeout_s: 12.0

safety:
  max_abs_roll_rad: 0.70
  max_abs_pitch_rad: 0.70
  stale_camera_s: 1.0

episode:
  # Must comfortably fit max_steps decisions at realistic VLM latency, same reasoning as
  # control.heartbeat_timeout_s above. 60s was tuned for local SmolVLM2 (~0.7s/decision mean).
  # --policy gpt (cloud API) measured 0.8-5.7s per decision (mean 1.37s, real network latency
  # variance) — at 60s, only 33/80 steps fit before episode_timeout cut the episode short, most
  # of that wall-clock time spent waiting on the API rather than walking (ep_gpt_pickup_002,
  # see conversation record). 200s gives real cloud-latency runs room to reach max_steps=80
  # even with occasional multi-second spikes (80 * (1.37 + action_duration_s 0.30 +
  # stop_settle_s 0.15) ≈ 145s, plus headroom).
  timeout_s: 200.0
  max_steps: 80
  stop_action_terminates: false

task:
  # Pick-and-carry extension beyond blueprint §14's navigate-and-stop instruction — GRASP/RELEASE
  # were added to NavAction once scripts/run_pickup_smoke.py proved the weld-based grasp works
  # live. Ground-truth success/distance metrics (below) are still xy-only navigation checks;
  # there's no scripted "did it actually carry the box" metric yet, only the per-step
  # ever_grasped field in metrics.json.
  instruction: "Walk to the red box, pick it up, and carry it to a new location."
  # Ground-truth target (x, y) — matches the navigation_target body's xy in
  # assets/scenes/g1_hub/assets/scene_43dof_with_target.xml (now on a pedestal at z=0.85 so the
  # arm can reach it; xy unchanged, and this xy-only distance metric doesn't care about height).
  # Only meaningful when G1_LOCAL_NAV_SCENE is set for the run — the default upstream scene has
  # no target there, so distance/success computed against these values isn't meaningful then.
  target_x: 2.0
  target_y: 0.0
  success_radius_m: 0.7

logging:
  root_dir: runs
  save_all_frames: true
  save_raw_model_output: true
