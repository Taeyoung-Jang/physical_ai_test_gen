[project]
name = "scene2test"
version = "0.1.0"
description = "3D Scene Graph 기반 Active Failure Search를 활용한 Physical AI 행동 회귀 테스트 자동화 시스템"
requires-python = ">=3.11"
dependencies = [
    "pybullet-arm64>=3.2.5",
    "numpy==1.26.4",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "open3d>=0.17",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.28",
    "tabulate>=0.10.0",
    "imageio[ffmpeg]>=2.9",
    "pillow>=9.0",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "torchaudio==2.2.0",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "timm==0.9.10",
    "sentencepiece==0.1.99",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
# 실제 VLA(OpenVLA) 통합용. Apple Silicon(MPS)·CUDA 공통.
# 설치:  uv sync --extra vla   (torch는 macOS arm64에서 자동으로 MPS 빌드)
# OpenVLA 호환을 위해 transformers/timm/tokenizers 버전을 고정한다.
vla = [
    "torch==2.2",
    "torchvision>=0.17",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "timm==0.9.10",
    "accelerate>=0.30",
    "einops>=0.7",
    "sentencepiece>=0.1.99",
]
# 3D object generation (Shap-E). 선택 설치. 없으면 procedural default 로 자동 폴백.
# 설치:  uv sync --extra gen3d   (torch 는 --extra vla 와 공유)
# diffusers 0.27.2 = OpenVLA용 transformers==4.40.1 과 호환되는 Shap-E 버전.
gen3d = [
    "torch>=2.2",
    "diffusers==0.27.2",
    "huggingface-hub==0.23.4",   # diffusers 0.27.2의 cached_download + transformers 4.40.1 호환
    "trimesh>=4.0",
]
# 3D scene 소스 로드/처리 (GLB → OBJ 변환, HM3D 백엔드 포함). 설치:  uv sync --extra scene3d
scene3d = [
    "trimesh>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
