[project]
name = "scene2test"
version = "0.1.0"
description = "3D Scene Graph 기반 Active Failure Search를 활용한 Physical AI 행동 회귀 테스트 자동화 시스템"
requires-python = ">=3.12"
dependencies = [
    "pybullet>=3.2.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "open3d>=0.17",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "streamlit>=1.28",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
