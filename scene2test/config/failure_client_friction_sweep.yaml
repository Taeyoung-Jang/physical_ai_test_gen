schema_version: "1.0"
experiment:
  experiment_id: "exp_g1_friction_sweep_20260903"
  title: "G1 GPU locomotion friction sweep"
  research_question: "At what ground-friction level does forward locomotion fail?"
  hypothesis: "Stability or tracking degrades as sliding friction approaches zero."
resources:
  scene: {id: "g1_locomotion_ground", revision: "sha256:3b0b5a1c8299fda85cf328cc2a8df53ccc765ce37f20030175295049947b1a19"}
