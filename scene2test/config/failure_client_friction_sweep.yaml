  version: "1.0"
  config:
    failure_events: [{rule_id: "fall", event_type: "BASE_HEIGHT_THRESHOLD_CROSSED"}]
    success_predicates:
      - {rule_id: "standing", source: "task_facts", path: "standing_at_end", operator: "truthy"}
      - {rule_id: "forward", source: "task_facts", path: "walked_forward", operator: "truthy"}
      - {rule_id: "tracking", source: "task_facts", path: "command_tracking_success", operator: "truthy"}
execution:
