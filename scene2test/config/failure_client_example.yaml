schema_version: "1.0"

experiment:
  experiment_id: "exp_g1_nav_failure_001"
  title: "G1 primitive-obstacle navigation failure search"
  research_question: >
    Which primitive obstacle placements produce reproducible failures for the
    selected G1 controller and policy?

resources:
  scene:
    id: "scene_001"
    revision: "sha256:replace-with-server-scene-revision"
  robot:
    id: "unitree_g1"
    profile_id: "default"
    revision: "sha256:replace-with-server-robot-revision"
  controller:
    id: "groot_locomotion"
    revision: "sha256:replace-with-server-controller-revision"
  policy:
    id: "scripted_navigation"
    revision: "sha256:replace-with-server-policy-revision"

task:
  schema: "navigate_to_pose@1.0"
  parameters:
    target_position_m: [3.0, 0.0, 0.0]

method:
  plugin_id: "sobol_parametric"
  plugin_version: "1.0.0"
  config:
    operation: "add_primitive"
    operation_version: "1.0"
    coordinate_frame: "scene"
    parameter_space:
      obstacle_x:
        kind: "continuous"
        low: 0.8
        high: 2.5
      obstacle_y:
        kind: "continuous"
        low: -0.8
        high: 0.8
    static_parameters:
      shape: "box"
      position_m: [0.0, 0.0, 0.2]
      size_m: [0.4, 0.2, 0.4]
    parameter_bindings:
      obstacle_x: "position_m.0"
      obstacle_y: "position_m.1"
    maximum_candidates: 100

failure_definition:
  id: "fd_g1_nav_v1"
  version: "1.0"
  config:
    failure_events:
      - rule_id: "robot_fall"
        event_type: "ROBOT_FALL"
      - rule_id: "severe_collision"
        event_type: "SEVERE_COLLISION"
    success_predicates:
      - rule_id: "target_reached"
        source: "task_facts"
        path: "target_reached"
        operator: "truthy"

execution:
  candidate_budget: 100
  repeats_per_candidate: 3
  master_seed: 101
  seed_policy: "sha256-v1"
  maximum_parallel_jobs: 1
  maximum_duration_s: 20.0

artifacts:
  trajectory: "always"
  events: "always"
  video: "always"
  policy_trace: "always"
